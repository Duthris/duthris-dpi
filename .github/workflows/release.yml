name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      # The engine is downloaded from the pinned zapret release and its checksum
      # verified, so what ships can be compared byte for byte with upstream.
      - name: Fetch the engine
        run: pnpm run engine

      - name: Typecheck, lint and build
        run: pnpm run verify

      - name: Package
        run: pnpm exec electron-builder --win --publish never

      # One step creates the release with every file. Letting electron-builder
      # publish both targets in parallel can create two releases for one tag.
      # latest.yml and the blockmap are what the auto-updater reads.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then body=(--notes-file "$notes"); else body=(--generate-notes); fi
          files=(release/Duthris-DPI-Setup-*.exe release/Duthris-DPI-Setup-*.exe.blockmap release/Duthris-DPI-Portable-*.exe release/latest.yml)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Duthris DPI ${GITHUB_REF_NAME#v}" "${body[@]}"
